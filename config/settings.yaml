studio:
  name: Studio
  version: "0.1.0"

paths:
  models_dir: models
  outputs_dir: outputs
  cache_dir: .cache

device:
  preferred: cuda        # cuda | mps | cpu
  dtype: float16         # float16 | bfloat16 | float32

# ── Video Generation ──────────────────────────────────────────────────────────
video_generation:
  default_pipeline: animatediff
  pipelines:
    animatediff:
      motion_adapter_id: guoyww/animatediff-motion-adapter-v1-5-2
      base_model_id: emilianJR/epiCRealism
    stable_video_diffusion:
      repo_id: stabilityai/stable-video-diffusion-img2vid-xt
    cogvideox:
      repo_id: THUDM/CogVideoX-5b
  defaults:
    fps: 8
    num_frames: 16
    width: 512
    height: 512
    guidance_scale: 7.5
    num_inference_steps: 25

# ── Face Swap ─────────────────────────────────────────────────────────────────
face_swap:
  detector_model: buffalo_l          # InsightFace detection model
  swapper_model: inswapper_128.onnx  # place in models/face_swap/
  blend_alpha: 0.95                  # opacity of swapped face (0–1)
  enhance_face: true                 # run GFPGAN post-enhance
  enhancer_model: GFPGANv1.4.pth    # place in models/enhancers/

# ── Talking Head (News Anchor Synthesis) ──────────────────────────────────────
talking_head:
  default_model: sadtalker
  models:
    sadtalker:
      checkpoint_dir: models/sadtalker
      config_dir: models/sadtalker/config
    wav2lip:
      checkpoint: models/wav2lip/wav2lip_gan.pth
  still_mode: false        # reduce head motion for formal anchor look
  preprocess: crop         # crop | resize | full
  face_enhancer: gfpgan

# ── Web Server ────────────────────────────────────────────────────────────────
web:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  max_upload_mb: 512

# ── News Pipeline ─────────────────────────────────────────────────────────────
news:
  ollama_url: "http://localhost:11434/api/generate"
  ollama_model: "llama3.2:3b"
  max_articles: 20
  words_per_minute: 130        # anchor delivery pace for SRT timing
  max_caption_chars: 42        # broadcast standard chars per caption line
  # API keys loaded from environment variables:
  #   NEWSAPI_KEY — newsapi.org
  #   GNEWS_KEY   — gnews.io
  rss_feeds:
    AP News:   "https://feeds.apnews.com/rss/apf-topnews"
    Reuters:   "https://feeds.reuters.com/reuters/topNews"
    BBC:       "https://feeds.bbci.co.uk/news/rss.xml"
    NPR:       "https://feeds.npr.org/1001/rss.xml"
    CBS News:  "https://www.cbsnews.com/latest/rss/main"
    ABC News:  "https://feeds.abcnews.com/abcnews/topstories"
    USA Today: "https://rssfeeds.usatoday.com/usatoday-NewsTopStories"

# ── Desktop App ───────────────────────────────────────────────────────────────
desktop:
  theme: dark
  window_title: "Studio — AI Video Lab"
  window_width: 1440
  window_height: 900
